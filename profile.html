<!doctype html>
<html lang="vi" class="h-100">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Thông tin tài khoản - kimcss.tech</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png" />

    <style>
        :root {
            --primary: #0d6efd;
            --primary1: #0a58ca;
            --accent: #d4af37;
            --logo-height: 54px;
        }

        /* Gold Shimmer Sweep Effect */
        .site-logo-img {
            position: relative;
            display: inline-block;
            height: var(--logo-height, 54px);
            max-height: 60px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.45));
            transition: all 0.3s ease;
        }

        .logo-shimmer-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            overflow: hidden;
            border-radius: 8px;
        }

        .logo-shimmer-wrapper::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 80%;
            height: 200%;
            background: linear-gradient(
                105deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 215, 0, 0.15) 30%,
                rgba(255, 255, 255, 0.7) 50%,
                rgba(255, 215, 0, 0.15) 70%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            pointer-events: none;
            animation: goldSweepLight 3.5s infinite ease-in-out;
        }

        @keyframes goldSweepLight {
            0% { left: -150%; opacity: 0; }
            15% { opacity: 1; }
            45% { left: 200%; opacity: 1; }
            50%, 100% { left: 200%; opacity: 0; }
        }
    </style>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="client/fonts/flaticon/flaticon.css">
    <link rel="stylesheet" href="client/fonts/icofont/icofont.min.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="client/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="client/css/main.css">
    <link rel="stylesheet" href="mod/css/main.css?v=21">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="sweetalert2/default.css" type="text/css">
    <script src="sweetalert2/sweetalert2.js"></script>
    <script src="js/jquery-3.6.0.js"></script>
</head>

<body>
    <div class="backdrop"></div>
    <a class="backtop" href="#"><i class="fa-sharp fa-solid fa-chevron-up"></i></a>

    <!-- Header Top -->
    <div class="header-top py-2 bg-light border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <div><small><i class="fa-solid fa-user-gear text-primary me-2"></i> Quản lý hồ sơ và bảo mật tài khoản</small></div>
            <div id="header-user-area"></div>
        </div>
    </div>

    <!-- Header Main -->
    <header class="header-part py-3 bg-white border-bottom shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="header-logo logo-shimmer-wrapper">
                <img class="site-logo-img" src="assets/storage/images/logo_dark_8OJ.png" onerror="this.src='client/images/logo.png'" alt="Logo" height="48">
            </a>
            <div class="d-flex gap-2">
                <a href="index.html" class="btn btn-outline-primary btn-sm rounded-pill px-3"><i class="fa-solid fa-house me-1"></i> Trang chủ</a>
                <a href="tools/index.html" class="btn btn-outline-info btn-sm rounded-pill px-3"><i class="fa-solid fa-toolbox me-1"></i> Tiện ích MMO</a>
                <a href="recharge.html" class="btn btn-outline-success btn-sm rounded-pill px-3"><i class="fa-solid fa-wallet me-1"></i> Nạp tiền</a>
                <a href="orders.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="fa-solid fa-bag-shopping me-1"></i> Đơn hàng</a>
            </div>
        </div>
    </header>

    <main class="py-5 bg-light min-vh-100">
        <div class="container">
            <div class="row g-4">
                <!-- User Profile Card -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100">
                        <h5 class="fw-bold text-primary mb-3"><i class="fa-solid fa-id-card me-2"></i> Thông Tin Thành Viên</h5>
                        <form id="form-profile">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Tên đăng nhập:</label>
                                <input type="text" id="prof-username" class="form-control" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Email:</label>
                                <input type="email" id="prof-email" class="form-control" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Họ và tên:</label>
                                <input type="text" id="prof-fullname" class="form-control" placeholder="Nhập họ tên...">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Số điện thoại:</label>
                                <input type="text" id="prof-phone" class="form-control" placeholder="Nhập số điện thoại...">
                            </div>
                            <button type="submit" class="btn btn-primary rounded-pill px-4" id="btnSaveProfile">
                                <i class="fa-solid fa-save me-1"></i> Lưu thông tin
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Change Password Card -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100">
                        <h5 class="fw-bold text-danger mb-3"><i class="fa-solid fa-lock me-2"></i> Đổi Mật Khẩu</h5>
                        <form id="form-password">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Mật khẩu hiện tại:</label>
                                <input type="password" id="current-pass" class="form-control" placeholder="Nhập mật khẩu hiện tại..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Mật khẩu mới:</label>
                                <input type="password" id="new-pass" class="form-control" placeholder="Tối thiểu 6 ký tự..." required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Xác nhận mật khẩu mới:</label>
                                <input type="password" id="confirm-pass" class="form-control" placeholder="Nhập lại mật khẩu mới..." required>
                            </div>
                            <button type="submit" class="btn btn-danger rounded-pill px-4" id="btnChangePass">
                                <i class="fa-solid fa-key me-1"></i> Đổi mật khẩu
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-part py-4 bg-dark text-white text-center">
        <small id="footer-copyright">© 2026 kimcss.tech | All Rights Reserved.</small>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>if (typeof bootstrap === 'undefined') document.write('<script src="client/vendor/bootstrap/bootstrap.bundle.min.js"><\/script>')</script>

    <!-- App Modules -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/i18n.js"></script>
    <script>
        async function loadProfile() {
            if (!window.auth.checkAuth('user')) return;
            const user = await window.auth.syncUser();
            if (user) {
                document.getElementById('prof-username').value = user.username || '';
                document.getElementById('prof-email').value = user.email || '';
                document.getElementById('prof-fullname').value = user.fullname || '';
                document.getElementById('prof-phone').value = user.phone || '';
            }
        }

        document.getElementById('form-profile').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullname = document.getElementById('prof-fullname').value;
            const phone = document.getElementById('prof-phone').value;
            const res = await window.api.post('/auth/profile', { fullname, phone });
            if (res && res.status === 'success') {
                window.api.alertSuccess('Cập nhật thông tin thành công!');
                window.auth.syncUser();
            } else {
                window.api.alertError(res ? res.msg : 'Cập nhật thất bại');
            }
        });

        document.getElementById('form-password').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPass = document.getElementById('current-pass').value;
            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;

            if (newPass !== confirmPass) {
                window.api.alertError('Mật khẩu xác nhận không khớp!');
                return;
            }

            const res = await window.api.post('/auth/change-password', {
                current_password: currentPass,
                new_password: newPass
            });

            if (res && res.status === 'success') {
                window.api.alertSuccess('Đổi mật khẩu thành công!');
                document.getElementById('form-password').reset();
            } else {
                window.api.alertError(res ? res.msg : 'Đổi mật khẩu thất bại!');
            }
        });

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>

</html>
