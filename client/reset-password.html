<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đặt lại mật khẩu - ShopClone 7</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../public/client/fonts/flaticon/flaticon.css">
    <link rel="stylesheet" href="../public/client/fonts/icofont/icofont.min.css">
    <link rel="stylesheet" href="../public/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../public/client/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../public/client/css/main.css">
    <link rel="stylesheet" href="../public/client/css/user-auth.css">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="../public/sweetalert2/default.css" type="text/css">
    <script src="../public/sweetalert2/sweetalert2.js"></script>
    <script src="../public/js/jquery-3.6.0.js"></script>
</head>

<body>
    <section class="user-form-part py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <div class="user-form-logo text-center mb-4">
                        <a href="home.html">
                            <img src="../assets/img/logo.png" onerror="this.src='../public/client/images/logo.png'" alt="logo" height="48">
                        </a>
                    </div>
                    <div class="user-form-card shadow-sm p-4 bg-white rounded">
                        <div class="user-form-title text-center mb-4">
                            <h3 class="fw-bold">ĐẶT LẠI MẬT KHẨU</h3>
                            <p class="text-muted small">Nhập mật khẩu mới cho tài khoản của bạn</p>
                        </div>
                        <form class="user-form" id="reset-form">
                            <div class="form-group mb-3">
                                <label class="form-label fw-bold">Mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Tối thiểu 6 ký tự..." required autofocus>
                                </div>
                            </div>
                            <div class="form-group mb-4">
                                <label class="form-label fw-bold">Nhập lại mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                                    <input type="password" class="form-control" id="re_password" placeholder="Nhập lại mật khẩu..." required>
                                </div>
                            </div>
                            <div class="form-button">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill" id="btnReset">
                                    <i class="fa-solid fa-check me-2"></i> LƯU MẬT KHẨU MỚI
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="user-form-remind text-center mt-4">
                        <p><a href="login.html" class="fw-bold text-primary"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại Đăng nhập</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap & Modules -->
    <script src="../public/client/vendor/bootstrap/bootstrap.min.js"></script>
    <script src="../assets/js/core/mock_db.js"></script>
    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                window.api.alertError('Mã token không hợp lệ hoặc đã hết hạn.');
                return;
            }

            const password = document.getElementById('password').value;
            const rePassword = document.getElementById('re_password').value;

            if (password !== rePassword) {
                window.api.alertError('Mật khẩu nhập lại không khớp!');
                return;
            }

            const btn = document.getElementById('btnReset');
            btn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i> Đang cập nhật...';
            btn.disabled = true;

            try {
                const res = await window.api.post('ajaxs/client/auth.php', {
                    action: 'ChangePassword',
                    token: token,
                    password: password,
                    repassword: rePassword
                });
                if (res && res.status === 'success') {
                    window.api.alertSuccess(res.msg || 'Đặt lại mật khẩu thành công!');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    window.api.alertError(res ? res.msg : 'Không thể đặt lại mật khẩu.');
                }
            } catch(err) {
                console.error('Reset error:', err);
                window.api.alertError('Lỗi kết nối máy chủ');
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-check me-2"></i> LƯU MẬT KHẨU MỚI';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
