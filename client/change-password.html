<!doctype html>
<html lang="vi" class="h-100">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đổi mật khẩu - ShopClone 7</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../public/client/fonts/flaticon/flaticon.css">
    <link rel="stylesheet" href="../public/client/fonts/icofont/icofont.min.css">
    <link rel="stylesheet" href="../public/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../public/client/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../public/client/css/main.css">
    <link rel="stylesheet" href="../public/client/css/wallet.css">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="../public/sweetalert2/default.css" type="text/css">
    <script src="../public/sweetalert2/sweetalert2.js"></script>
    <script src="../public/js/jquery-3.6.0.js"></script>
</head>

<body>
    <!-- Header Top -->
    <div class="header-top py-2 bg-light border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <div><small><i class="fa fa-key text-primary me-2"></i> Thay đổi mật khẩu đăng nhập</small></div>
            <div id="header-user-area"></div>
        </div>
    </div>

    <!-- Header Main -->
    <header class="header-part py-3 border-bottom bg-white">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="home.html">
                <img src="../assets/img/logo.png" onerror="this.src='../public/client/images/logo.png'" alt="logo" height="40">
            </a>
            <div class="d-flex gap-2">
                <a href="home.html" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-house me-1"></i> Trang chủ</a>
                <a href="profile.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-user me-1"></i> Hồ sơ</a>
            </div>
        </div>
    </header>

    <main class="py-5 bg-light min-vh-100">
        <div class="container">
            <div class="row">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3 mb-4">
                    <div class="card border-0 shadow-sm overflow-hidden">
                        <div class="list-group list-group-flush">
                            <a href="profile.html" class="list-group-item list-group-item-action py-3"><i class="fas fa-user me-2"></i> Thông tin cá nhân</a>
                            <a href="security.html" class="list-group-item list-group-item-action py-3"><i class="fa-solid fa-shield-halved me-2"></i> Bảo mật tài khoản</a>
                            <a href="change-password.html" class="list-group-item list-group-item-action active fw-bold py-3"><i class="fa fa-key me-2"></i> Đổi mật khẩu</a>
                            <a href="transactions.html" class="list-group-item list-group-item-action py-3"><i class="fa-solid fa-wallet me-2"></i> Biến động số dư</a>
                            <a href="logs.html" class="list-group-item list-group-item-action py-3"><i class="fa fa-history me-2"></i> Nhật ký hoạt động</a>
                            <a href="javascript:void(0)" class="list-group-item list-group-item-action text-danger py-3" onclick="window.auth.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất</a>
                        </div>
                    </div>
                </div>

                <!-- Main Content Area -->
                <div class="col-lg-9">
                    <div class="card border-0 shadow-sm p-4">
                        <h5 class="fw-bold border-bottom pb-2 mb-4"><i class="fa fa-key text-primary me-2"></i> Đổi mật khẩu</h5>
                        
                        <form id="formChangePassword">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu hiện tại (<span class="text-danger">*</span>)</label>
                                <input type="password" class="form-control" id="old_password" placeholder="Nhập mật khẩu cũ..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu mới (<span class="text-danger">*</span>)</label>
                                <input type="password" class="form-control" id="new_password" placeholder="Tối thiểu 6 ký tự..." required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Nhập lại mật khẩu mới (<span class="text-danger">*</span>)</label>
                                <input type="password" class="form-control" id="re_new_password" placeholder="Nhập lại mật khẩu mới..." required>
                            </div>
                            <button type="submit" class="btn btn-primary" id="btnChangePassword">
                                <i class="fa-solid fa-check me-1"></i> Lưu thay đổi mật khẩu
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 bg-dark text-white text-center">
        <small>© 2026 ShopClone 7 | All Rights Reserved.</small>
    </footer>

    <!-- Bootstrap & Modules -->
    <script src="../public/client/vendor/bootstrap/bootstrap.min.js"></script>
    <script src="../assets/js/core/mock_db.js"></script>
    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.auth.checkAuth('user')) return;

            document.getElementById('formChangePassword').addEventListener('submit', async (e) => {
                e.preventDefault();
                const oldPassword = document.getElementById('old_password').value;
                const newPassword = document.getElementById('new_password').value;
                const rePassword = document.getElementById('re_new_password').value;

                if (newPassword !== rePassword) {
                    window.api.alertError('Mật khẩu nhập lại không khớp!');
                    return;
                }

                const btn = document.getElementById('btnChangePassword');
                btn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i> Đang đổi...';
                btn.disabled = true;

                try {
                    const res = await window.api.post('ajaxs/client/auth.php', {
                        action: 'ChangePasswordProfile',
                        old_password: oldPassword,
                        new_password: newPassword,
                        renew_password: rePassword
                    });

                    if (res && res.status === 'success') {
                        window.api.alertSuccess(res.msg || 'Đổi mật khẩu thành công! Vui lòng đăng nhập lại.');
                        setTimeout(() => {
                            window.auth.logout();
                        }, 1500);
                    } else {
                        window.api.alertError(res ? res.msg : 'Đổi mật khẩu thất bại.');
                    }
                } catch(err) {
                    console.error(err);
                } finally {
                    btn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Lưu thay đổi mật khẩu';
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
