<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đăng nhập tài khoản - ShopClone 7</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../public/client/fonts/flaticon/flaticon.css">
    <link rel="stylesheet" href="../public/client/fonts/icofont/icofont.min.css">
    <link rel="stylesheet" href="../public/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../public/client/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../public/client/css/main.css">
    <link rel="stylesheet" href="../public/client/css/user-auth.css">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="../public/sweetalert2/default.css" type="text/css">
    <script src="../public/sweetalert2/sweetalert2.js"></script>
    <script src="../public/js/jquery-3.6.0.js"></script>
</head>

<body>
    <section class="user-form-part">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <div class="user-form-logo text-center mb-4">
                        <a href="home.html">
                            <img src="../assets/img/logo.png" onerror="this.src='../public/client/images/logo.png'" alt="logo" height="48">
                        </a>
                    </div>
                    <div class="user-form-card shadow-sm p-4 bg-white rounded">
                        <div class="user-form-title text-center mb-4">
                            <h3 class="fw-bold">ĐĂNG NHẬP</h3>
                            <p class="text-muted small">Chào mừng bạn quay trở lại với ShopClone 7</p>
                        </div>
                        <form class="user-form" id="login-form">
                            <div class="form-group mb-3">
                                <label class="form-label fw-bold">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" class="form-control" id="username" placeholder="Nhập username của bạn..." required autofocus>
                                </div>
                            </div>
                            <div class="form-group mb-3">
                                <label class="form-label fw-bold">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu..." required>
                                </div>
                            </div>
                            <div class="form-check d-flex justify-content-between align-items-center mb-4">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="check-remember" checked>
                                    <label class="form-check-label small" for="check-remember">Ghi nhớ đăng nhập</label>
                                </div>
                                <a href="forgot-password.html" class="small text-decoration-none">Quên mật khẩu?</a>
                            </div>
                            <div class="form-button">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill" id="btnLogin">
                                    <i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="user-form-remind text-center mt-4">
                        <p class="text-muted">Chưa có tài khoản? <a href="register.html" class="fw-bold text-primary">Đăng ký ngay</a></p>
                        <p><a href="home.html" class="text-secondary small"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang chủ</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap & Modules -->
    <script src="../public/client/vendor/bootstrap/bootstrap.min.js"></script>
    <script src="../assets/js/core/mock_db.js"></script>
    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script src="../assets/js/modules/client/login.js"></script>
</body>

</html>
