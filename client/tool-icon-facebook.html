<!doctype html>
<html lang="vi" class="h-100">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Icon Facebook - ShopClone 7</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png" />

<body>
    <!-- Header Top -->
    <div class="header-top py-2 bg-light border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <div><small><i class="fa-solid fa-icons text-primary me-2"></i> Bảng ký tự và biểu tượng Emoji Facebook</small></div>
            <div id="header-user-area"></div>
        </div>
    </div>

    <!-- Header Main -->
    <header class="header-part py-3 border-bottom bg-white">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="home.html">
                <img src="../assets/img/logo.png" onerror="this.src='../public/client/images/logo.png'" alt="logo" height="40">
            </a>
            <div class="d-flex gap-2">
                <a href="home.html" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-house me-1"></i> Trang chủ</a>

            <div class="card border-0 rounded-4 overflow-hidden mb-4 shadow-sm" style="background: linear-gradient(135deg, #1877f2 0%, #0d6efd 100%);">
                <div class="card-body p-4 text-white d-flex align-items-center">
                    <img src="../mod/img/icon-facebook.png" alt="Icon FB" width="60" height="60" class="me-3">
                    <div>
                        <small class="opacity-75">Tiện ích MMO</small>
                        <h4 class="fw-bold mb-0">Bảng Icon & Biểu tượng cảm xúc Facebook</h4>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-2 bg-white">
                <iframe src="https://www.smileysapp.com/emojiPicker/" class="border-0 rounded" width="100%" style="height: calc(100vh - 220px); min-height: 600px;"></iframe>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 bg-dark text-white text-center">
        <small>© 2026 ShopClone 7 | All Rights Reserved.</small>
    </footer>

    <!-- Bootstrap & Modules -->
    <script src="../public/client/vendor/bootstrap/bootstrap.min.js"></script>
    <script src="../assets/js/core/mock_db.js"></script>
    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
