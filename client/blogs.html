<!doctype html>
<html lang="vi" class="h-100">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Tin tức & Hướng dẫn - ShopClone 7</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../public/client/fonts/flaticon/flaticon.css">
    <link rel="stylesheet" href="../public/client/fonts/icofont/icofont.min.css">
    <link rel="stylesheet" href="../public/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../public/client/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../public/client/css/main.css">
    <link rel="stylesheet" href="../public/client/css/blog-grid.css">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="../public/sweetalert2/default.css" type="text/css">
    <script src="../public/sweetalert2/sweetalert2.js"></script>
    <script src="../public/js/jquery-3.6.0.js"></script>
</head>

<body>
    <!-- Header Top -->
    <div class="header-top py-2 bg-light border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <div><small><i class="fa-solid fa-newspaper text-primary me-2"></i> Kiến thức & tin tức cộng đồng MMO</small></div>
            <div id="header-user-area"></div>
        </div>
    </div>

    <!-- Header Main -->
    <header class="header-part py-3 border-bottom bg-white">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="home.html">
                <img src="../assets/img/logo.png" onerror="this.src='../public/client/images/logo.png'" alt="logo" height="40">
            </a>
            <div class="d-flex gap-2">
                <a href="home.html" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-house me-1"></i> Trang chủ</a>
                <a href="document-api.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-code me-1"></i> Tài liệu API</a>
            </div>
        </div>
    </header>

    <main class="py-5 bg-light min-vh-100">
        <div class="container">
            <div class="text-center mb-5">
                <h3 class="fw-bold">TIN TỨC & BÀI VIẾT HƯỚNG DẪN</h3>
                <p class="text-muted">Cập nhật những thủ thuật nuôi nick, kinh nghiệm MMO và thông tin công nghệ mới nhất</p>
            </div>

            <div class="row g-4" id="blogs-container">
                <div class="col-12 text-center py-5 text-muted">
                    <i class="fa fa-spinner fa-spin fa-2x text-primary mb-2"></i>
                    <p>Đang tải bài viết...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 bg-dark text-white text-center">
        <small>© 2026 ShopClone 7 | All Rights Reserved.</small>
    </footer>

    <!-- Bootstrap & Modules -->
    <script src="../public/client/vendor/bootstrap/bootstrap.min.js"></script>
    <script src="../assets/js/core/mock_db.js"></script>
    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('blogs-container');
            try {
                const res = await window.api.get('api/data.php', { action: 'get_blogs' });
                if (res && res.status === 'success' && res.data && res.data.length > 0) {
                    container.innerHTML = res.data.map(b => `
                        <div class="col-md-6 col-lg-4">
                            <div class="card h-100 border-0 shadow-sm overflow-hidden">
                                <img src="../${b.image || 'assets/img/default-blog.png'}" onerror="this.src='https://placehold.co/600x350?text=News'" class="card-img-top" alt="${b.title}" style="height: 200px; object-fit: cover;">
                                <div class="card-body">
                                    <small class="text-muted"><i class="fa-regular fa-clock me-1"></i> ${b.create_date || ''} • <i class="fa-regular fa-eye ms-2 me-1"></i> ${b.view || 0}</small>
                                    <h5 class="card-title fw-bold mt-2">
                                        <a href="blog.html?slug=${b.slug}" class="text-decoration-none text-dark">${b.title}</a>
                                    </h5>
                                    <p class="card-text text-muted small">${(b.description || '').substring(0, 110)}...</p>
                                </div>
                                <div class="card-footer bg-white border-0 pt-0">
                                    <a href="blog.html?slug=${b.slug}" class="btn btn-sm btn-link text-primary p-0 text-decoration-none fw-bold">Đọc tiếp <i class="fa-solid fa-arrow-right ms-1"></i></a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fa-solid fa-newspaper fs-1 text-muted mb-3"></i>
                            <p class="text-muted">Chưa có bài viết nào được đăng tải</p>
                        </div>
                    `;
                }
            } catch(e) {
                console.error(e);
            }
        });
    </script>
</body>

</html>
