<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Quên mật khẩu - ShopClone 7</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../public/client/fonts/flaticon/flaticon.css">
    <link rel="stylesheet" href="../public/client/fonts/icofont/icofont.min.css">
    <link rel="stylesheet" href="../public/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../public/client/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../public/client/css/main.css">
    <link rel="stylesheet" href="../public/client/css/user-auth.css">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="../public/sweetalert2/default.css" type="text/css">
    <script src="../public/sweetalert2/sweetalert2.js"></script>
    <script src="../public/js/jquery-3.6.0.js"></script>
</head>

<body>
    <section class="user-form-part py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <div class="user-form-logo text-center mb-4">
                        <a href="home.html">
                            <img src="../assets/img/logo.png" onerror="this.src='../public/client/images/logo.png'" alt="logo" height="48">
                        </a>
                    </div>
                    <div class="user-form-card shadow-sm p-4 bg-white rounded">
                        <div class="user-form-title text-center mb-4">
                            <h3 class="fw-bold">KHÔI PHỤC MẬT KHẨU</h3>
                            <p class="text-muted small">Nhập email của bạn để nhận liên kết đặt lại mật khẩu</p>
                        </div>
                        <form class="user-form" id="forgot-form">
                            <div class="form-group mb-4">
                                <label class="form-label fw-bold">Địa chỉ Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="example@gmail.com" required autofocus>
                                </div>
                            </div>
                            <div class="form-button">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill" id="btnForgot">
                                    <i class="fa-solid fa-paper-plane me-2"></i> GỬI YÊU CẦU
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="user-form-remind text-center mt-4">
                        <p class="text-muted">Nhớ mật khẩu rồi? <a href="login.html" class="fw-bold text-primary">Đăng nhập</a></p>
                        <p><a href="home.html" class="text-secondary small"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang chủ</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap & Modules -->
    <script src="../public/client/vendor/bootstrap/bootstrap.min.js"></script>
    <script src="../assets/js/core/mock_db.js"></script>
    <script src="../assets/js/modules/api.js"></script>
    <script src="../assets/js/modules/auth.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnForgot');
            btn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i> Đang gửi...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            try {
                const res = await window.api.post('ajaxs/client/auth.php', {
                    action: 'ForgotPassword',
                    email: email
                });
                if (res && res.status === 'success') {
                    window.api.alertSuccess(res.msg || 'Đã gửi liên kết khôi phục qua email của bạn!');
                } else {
                    window.api.alertError(res ? res.msg : 'Không tìm thấy tài khoản với email này.');
                }
            } catch(err) {
                console.error('Forgot error:', err);
                window.api.alertError('Lỗi kết nối máy chủ');
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> GỬI YÊU CẦU';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
