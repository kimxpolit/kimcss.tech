<!doctype html>
<html lang="vi" class="h-100">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Lịch sử đơn hàng - ShopClone 7</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png" />

    <style>
        :root {
            --primary: #0d6efd;
            --primary1: #0a58ca;
        }
    </style>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="client/fonts/flaticon/flaticon.css">
    <link rel="stylesheet" href="client/fonts/icofont/icofont.min.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="client/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="client/css/main.css">
    <link rel="stylesheet" href="mod/css/main.css?v=21">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="sweetalert2/default.css" type="text/css">
    <script src="sweetalert2/sweetalert2.js"></script>
    <script src="js/jquery-3.6.0.js"></script>
</head>

<body>
    <div class="backdrop"></div>
    <a class="backtop" href="#"><i class="fa-sharp fa-solid fa-chevron-up"></i></a>

    <!-- Header Top -->
    <div class="header-top py-2 bg-light border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <div><small><i class="fa-solid fa-bag-shopping text-primary me-2"></i> Toàn bộ tài khoản đã mua được lưu trữ vĩnh viễn trên hệ thống</small></div>
            <div id="header-user-area"></div>
        </div>
    </div>

    <!-- Header Main -->
    <header class="header-part py-3 bg-white border-bottom shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="header-logo">
                <img src="assets/storage/images/logo_dark_8OJ.png" onerror="this.src='client/images/logo.png'" alt="ShopClone 7" height="42">
            </a>
            <div class="d-flex gap-2">
                <a href="index.html" class="btn btn-outline-primary btn-sm rounded-pill px-3"><i class="fa-solid fa-house me-1"></i> Trang chủ</a>
                <a href="recharge.html" class="btn btn-outline-success btn-sm rounded-pill px-3"><i class="fa-solid fa-wallet me-1"></i> Nạp tiền</a>
            </div>
        </div>
    </header>

    <main class="py-5 bg-light min-vh-100">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-clock-rotate-left text-primary me-2"></i> Lịch Sử Đơn Hàng Đã Mua</h4>
                <a href="index.html" class="btn btn-primary btn-sm rounded-pill px-3"><i class="fa-solid fa-cart-plus me-1"></i> Mua thêm</a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Mã đơn</th>
                                    <th>Thời gian</th>
                                    <th>Sản phẩm</th>
                                    <th>Số lượng</th>
                                    <th>Tổng tiền</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table-body">
                                <tr>
                                    <td colspan="7" class="text-center py-4 text-muted">Đang tải danh sách đơn hàng...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-part py-4 bg-dark text-white text-center">
        <small>© 2026 ShopClone 7 | All Rights Reserved.</small>
    </footer>

    <!-- Bootstrap & Vendor Scripts -->
    <script src="client/vendor/bootstrap/popper.min.js"></script>
    <script src="client/vendor/bootstrap/bootstrap.min.js"></script>

    <!-- App Modules -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/i18n.js"></script>
    <script src="js/orders.js"></script>
</body>

</html>
