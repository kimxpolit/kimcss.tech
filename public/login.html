<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đăng nhập tài khoản - ShopClone 7</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="client/fonts/flaticon/flaticon.css">
    <link rel="stylesheet" href="client/fonts/icofont/icofont.min.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="client/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="client/css/main.css">
    <link rel="stylesheet" href="client/css/user-auth.css">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="sweetalert2/default.css" type="text/css">
    <script src="sweetalert2/sweetalert2.js"></script>
    <script src="js/jquery-3.6.0.js"></script>
</head>

<body>
    <section class="user-form-part py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <div class="user-form-logo text-center mb-4">
                        <a href="index.html">
                            <img src="assets/storage/images/logo_dark_8OJ.png" onerror="this.src='client/images/logo.png'" alt="ShopClone 7" height="48">
                        </a>
                    </div>
                    <div class="user-form-card shadow-sm p-4 bg-white rounded-4">
                        <div class="user-form-title text-center mb-4">
                            <h3 class="fw-bold">ĐĂNG NHẬP</h3>
                            <p class="text-muted small">Chào mừng bạn quay trở lại với ShopClone 7</p>
                        </div>
                        <form class="user-form" id="login-form">
                            <div class="form-group mb-3">
                                <label class="form-label fw-bold small">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" class="form-control" id="username" placeholder="Nhập username..." required autofocus>
                                </div>
                            </div>
                            <div class="form-group mb-3">
                                <label class="form-label fw-bold small">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu..." required>
                                </div>
                            </div>
                            <div class="form-check d-flex justify-content-between align-items-center mb-4">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="check-remember" checked>
                                    <label class="form-check-label small" for="check-remember">Ghi nhớ đăng nhập</label>
                                </div>
                            </div>
                            <div class="form-button">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill" id="btnLogin">
                                    <i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="user-form-remind text-center mt-4">
                        <p class="text-muted">Chưa có tài khoản? <a href="register.html" class="fw-bold text-primary">Đăng ký ngay</a></p>
                        <p><a href="index.html" class="text-secondary small"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang chủ</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap & Modules -->
    <script src="client/vendor/bootstrap/bootstrap.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/i18n.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i> Đang đăng nhập...';
            btn.disabled = true;

            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            try {
                await window.auth.login(u, p);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
