<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="25%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="75%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#FFA800"/>
      <stop offset="90%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="silverSub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crown Icon (Left) -->
  <g transform="translate(10, 14)" filter="url(#shadow)">
    <!-- Base Ribbon -->
    <path d="M 12 50 L 58 50 L 54 58 L 16 58 Z" fill="url(#goldCrown)"/>
    <circle cx="23" cy="54" r="2" fill="#FFFFFF"/>
    <circle cx="35" cy="54" r="2.5" fill="#FFFFFF"/>
    <circle cx="47" cy="54" r="2" fill="#FFFFFF"/>

    <!-- Crown Body -->
    <path d="M 10 46 L 60 46 L 56 26 L 43 36 L 35 12 L 27 36 L 14 26 Z" fill="url(#goldCrown)" stroke="#FFF9D2" stroke-width="0.8"/>

    <!-- Jewels on Peaks -->
    <circle cx="35" cy="10" r="3.5" fill="#FFFBE6" filter="url(#goldGlow)"/>
    <circle cx="14" cy="24" r="2.5" fill="#FFFBE6"/>
    <circle cx="56" cy="24" r="2.5" fill="#FFFBE6"/>
    <circle cx="27" cy="36" r="1.8" fill="#FFFFFF"/>
    <circle cx="43" cy="36" r="1.8" fill="#FFFFFF"/>

    <!-- Diamond Emblem in Center of Crown -->
    <polygon points="35,28 40,35 35,42 30,35" fill="#FFFFFF" opacity="0.9"/>

    <!-- Sparkle Stars -->
    <path d="M 62 10 Q 64 16 70 18 Q 64 20 62 26 Q 60 20 54 18 Q 60 16 62 10 Z" fill="#FFE082" opacity="0.9" transform="scale(0.6) translate(30, -5)"/>
  </g>

  <!-- Main Brand Name: HOÀNG KIM -->
  <g transform="translate(90, 48)" filter="url(#shadow)">
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', 'Cinzel', serif" font-size="34" font-weight="900" letter-spacing="2.5" fill="url(#goldText)">
      HOÀNG KIM
    </text>
  </g>

  <!-- Subtitle: HỆ THỐNG MMO TỰ ĐỘNG -->
  <g transform="translate(92, 70)">
    <!-- Underline bar -->
    <line x1="0" y1="-4" x2="330" y2="-4" stroke="url(#goldCrown)" stroke-width="1.2" opacity="0.6"/>
    
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="4" fill="url(#silverSub)" opacity="0.95">
      HỆ THỐNG MMO TỰ ĐỘNG
    </text>
    
    <!-- VIP Tag -->
    <rect x="295" y="-14" width="34" height="15" rx="3" fill="url(#goldCrown)"/>
    <text x="312" y="-3" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#000000" text-anchor="middle">VIP</text>
  </g>
</svg>
